<body>
    <div class="container">
        <div class="checkout-wrapper">
            <form class="checkout-billing">
                <h3>Billing details</h3>
                
                <div class="checkout-row">
                    <div class="checkout-col">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div class="checkout-col">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>

                <label for="company-name">Company Name (Optional)</label>
                <input type="text" id="company-name" name="company-name">

                <label for="country">Country / Region</label>
                <select id="country" name="country">
                    <option value="Sri Lanka">Sri Lanka</option>
                </select>

                <div class="checkout-row">
                    <div class="checkout-col">
                        <label for="street-address">Street Address</label>
                        <input type="text" id="street-address" name="street-address">
                    </div>
                    <div class="checkout-col">
                        <label for="city">Town / City</label>
                        <input type="text" id="city" name="city">
                    </div>
                </div>

                <label for="province">Province</label>
                <select id="province" name="province">
                    <option value="Western Province">Western Province</option>
                </select>

                <label for="zip">ZIP Code</label>
                <input type="text" id="zip" name="zip">

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">

                <label for="email">Email address</label>
                <input type="email" id="email" name="email">

                <label for="additional-info">Additional Information</label>
                <textarea id="additional-info" name="additional-info"></textarea>
            </form>

            <div class="checkout-summary">
                <div class="checkout-product">
                    <h6>Product</h6>
                    <h6>Subtotal</h6>
                    </div>
                <div class="checkout-product">
                    <p><span >Aggroset Sofa </span> x 1</p>
                    <p>Rs.250.000.00</p>
                </div>
                <div class="checkout-product">
                    <p>Subtotal</p>
                    <p>Rs.250.000.00</p>
                </div>
                <div class="checkout-product">
                    <p>Total</p>
                    
                    <h5 class="checkout-total">Rs.250.000.00</h5>
                </div>
                <hr>
                <div class="checkout-payment-method">
                    <label><input type="radio" name="payment" > Direct Bank Transfer</label>
                    <p class="checkout-payment-info">Make your payment directly into our bank account. Please use your Order ID as the payment reference. Your order will not be shipped until the funds have cleared in our account.</p>
                    <label><input type="radio" name="payment"><p class="checkout-lable"> Direct Bank Transfer</p></label>
                    <label><input type="radio" name="payment"><p class="checkout-lable"> Cash On Delivery</p></label>
                </div>

                <button class="checkout-place-order">Place order</button>
            </div>
        </div>
    </div>
</body>
